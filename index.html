<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CarPDF Studio Ultimate</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --accent: #38bdf8;
      --accent-green: #4ade80;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; display: flex; flex-direction: column; gap: 10px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; }
    h1 { font-size: 1.15rem; color: var(--accent); }
    .badge { font-size: 0.7rem; background: #1e293b; color: var(--accent); padding: 3px 8px; border-radius: 6px; }

    .card { background: var(--card); border: 1px solid #222; border-radius: 14px; padding: 14px; }
    
    input[type="file"] { display: none; }
    .btn-upload { display: block; width: 100%; text-align: center; background: var(--accent); color: #000; font-weight: 700; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; }
    
    .settings-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 10px; }
    select { width: 100%; padding: 8px; border-radius: 8px; background: #1a1a1a; color: var(--text); border: 1px solid #333; font-size: 0.85rem; }

    /* Area Guida (Schermo Nero Tattile) */
    .car-mode-screen { background: #080808; border: 2px dashed #333; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; min-height: 130px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
    .car-mode-screen:active { background: #1a1a1a; }
    .status-info { font-size: 0.85rem; color: var(--muted); }
    .main-action-text { font-size: 1.3rem; font-weight: 800; color: var(--accent-green); }

    .car-controls { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-car { border: none; border-radius: 12px; padding: 18px 8px; font-size: 1rem; font-weight: 700; cursor: pointer; color: var(--text); background: #222; }
    .btn-play { background: var(--accent-green); color: #000; font-size: 1.2rem; }

    .toolbar-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-tool { flex: 1; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: var(--text); border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

    /* Visualizzatore e Segnalibri */
    .text-box { max-height: 140px; overflow-y: auto; font-size: 0.95rem; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; margin-top: 8px; }
    .bookmarks-container { max-height: 100px; overflow-y: auto; font-size: 0.8rem; color: var(--muted); margin-top: 6px; border-top: 1px solid #222; padding-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>🚗 CarPDF Ultimate</h1>
    <span id="offline-status" class="badge">100% Offline</span>
  </header>

  <!-- Upload e Libreria -->
  <div class="card">
    <label class="btn-upload">
      📂 Seleziona o Cambia PDF
      <input type="file" id="pdf-upload" accept="application/pdf">
    </label>
    <div class="settings-grid">
      <select id="voice-select"><option>Caricamento voci...</option></select>
      <select id="rate-select">
        <option value="0.9">0.9x Lento</option>
        <option value="1.0" selected>1.0x Normale</option>
        <option value="1.15">1.15x Fluido</option>
        <option value="1.3">1.3x Veloce</option>
      </select>
    </div>
  </div>

  <!-- Schermo Principale Auto (Gesti Ciechi) -->
  <div class="card">
    <div id="touch-pad" class="car-mode-screen" title="Tocca per Pausa/Riproduci, Doppio tocco per Segnalibro">
      <div class="status-info" id="book-title">Nessun libro caricato (Tocca qui per iniziare)</div>
      <div class="main-action-text" id="big-status-label">PRONTO</div>
      <div class="status-info" id="page-indicator">Pag. 0 / 0</div>
    </div>

    <div class="car-controls">
      <button class="btn-car" id="prev-btn">⏮ Indietro</button>
      <button class="btn-car btn-play" id="play-btn">▶ LEGGI</button>
      <button class="btn-car" id="next-btn">Avanti ⏭</button>
    </div>

    <div class="toolbar-row">
      <button class="btn-tool" id="summary-btn">🎓 Spiega Pagina</button>
      <button class="btn-tool" id="quiz-btn">🧠 Quiz Vocale</button>
      <button class="btn-tool" id="bookmark-btn">📌 Salva Segnalibro</button>
    </div>
  </div>

  <!-- Testo e Segnalibri Salvati -->
  <div class="card" style="flex: 1;">
    <div style="font-size: 0.8rem; color: var(--muted); font-weight: bold;">TESTO PULITO DELLA PAGINA:</div>
    <div id="text-display" class="text-box">Carica un PDF. L'app ricorderà automaticamente la pagina e la libreria sul tuo dispositivo.</div>
    <div class="bookmarks-container" id="bookmarks-list"><strong>Segnalibri vocali salvati:</strong> Nessuno</div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let cleanSentences = [];
  let currentSentenceIndex = 0;
  let isPlaying = false;
  let currentFileName = "";
  let db = null;
  let bookmarks = [];
  let synth = window.speechSynthesis;
  let voices = [];

  const playBtn = document.getElementById('play-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const summaryBtn = document.getElementById('summary-btn');
  const quizBtn = document.getElementById('quiz-btn');
  const bookmarkBtn = document.getElementById('bookmark-btn');
  const touchPad = document.getElementById('touch-pad');
  const textDisplay = document.getElementById('text-display');
  const pageIndicator = document.getElementById('page-indicator');
  const bookTitle = document.getElementById('book-title');
  const bigStatusLabel = document.getElementById('big-status-label');
  const voiceSelect = document.getElementById('voice-select');
  const rateSelect = document.getElementById('rate-select');
  const bookmarksList = document.getElementById('bookmarks-list');

  // 1. Inizializzazione Database IndexedDB (Libreria persistente)
  const request = indexedDB.open('CarPDFDB', 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'name' });
  };
  request.onsuccess = (e) => {
    db = e.target.result;
    loadLastBook();
  };

  function savePDFToDB(file, arrayBuffer) {
    if (!db) return;
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put({ name: file.name, data: arrayBuffer });
  }

  function loadLastBook() {
    if (!db) return;
    const tx = db.transaction('files', 'readonly');
    const store = tx.objectStore('files');
    const req = store.getAll();
    req.onsuccess = async () => {
      const items = req.result;
      if (items.length > 0) {
        const last = items[items.length - 1];
        currentFileName = last.name;
        bookTitle.textContent = currentFileName.substring(0, 22);
        const pdfData = last.data;
        pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
        totalPages = pdfDoc.numPages;
        const savedPage = localStorage.getItem(`page_${currentFileName}`);
        currentPage = savedPage ? parseInt(savedPage, 10) : 1;
        loadBookmarks();
        await loadPage(currentPage);
      }
    };
  }

  // 2. Caricamento Voci
  function populateVoices() {
    voices = synth.getVoices().filter(v => v.lang.startsWith('it') || v.lang.startsWith('en'));
    voiceSelect.innerHTML = '';
    voices.forEach((voice, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${voice.name} (${voice.lang})`;
      if (voice.lang.startsWith('it') && (voice.name.includes('Natural') || voice.name.includes('Premium') || voice.name.includes('Siri') || voice.name.includes('Google'))) {
        opt.selected = true;
      }
      voiceSelect.appendChild(opt);
    });
  }
  populateVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoices;
  }

  // 3. Gestione Upload File
  document.getElementById('pdf-upload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    currentFileName = file.name;
    bookTitle.textContent = currentFileName.substring(0, 22);

    const arrayBuffer = await file.arrayBuffer();
    savePDFToDB(file, arrayBuffer);

    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    totalPages = pdfDoc.numPages;
    currentPage = 1;
    loadBookmarks();
    await loadPage(currentPage);
  });

  // 4. Filtro Accademico Intelligente sul PDF (Scarta intestazioni, note e sistema abbreviazioni)
  async function loadPage(pageNum) {
    if (!pdfDoc) return;
    stopSpeech();
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.0 });
    const textContent = await page.getTextContent();
    
    const pageHeight = viewport.height;
    const minYLimit = pageHeight * 0.08; // Scarta 8% superiore (Intestazioni)
    const maxYLimit = pageHeight * 0.92; // Scarta 8% inferiore (Piè di pagina)

    let rawText = "";
    textContent.items.forEach(item => {
      const y = item.transform[5];
      // Ricostruisce coordinata Y invertita in PDF.js
      const realY = pageHeight - y;
      if (realY > minYLimit && realY < maxYLimit) {
        rawText += item.str + " ";
      }
    });

    // Pulizia abbreviazioni e formattazione accademica
    const cleaned = rawText
      .replace(/-\s+/g, '')
      .replace(/\bart\.\s*/gi, 'articolo ')
      .replace(/\bcfr\.\s*/gi, 'confronta ')
      .replace(/\bdoc\.\s*/gi, 'documento ')
      .replace(/\bes\.\s*/gi, 'esempio ')
      .replace(/\bcap\.\s*/gi, 'capitolo ')
      .replace(/\bvs\.\s*/gi, 'contro ')
      .replace(/\bcid\.\s*/gi, 'citato ')
      .replace(/\[\d+\]/g, '') // Rimuove note bibliografiche tra parentesi quadre
      .replace(/\s+/g, ' ')
      .trim();

    textDisplay.textContent = cleaned || "(Nessun testo rilevante in questa pagina)";
    pageIndicator.textContent = `Pag. ${currentPage} / ${totalPages}`;
    
    // Suddivisione in frasi per la Regia Prosodica
    cleanSentences = cleaned.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [cleaned];
    currentSentenceIndex = 0;

    localStorage.setItem(`page_${currentFileName}`, currentPage);
    updateMediaSession();
  }

  // 5. Motore Vocale con Regia Prosodica ("Voce da Insegnante")
  function speakSentences(startIndex = 0) {
    if (!cleanSentences.length) return;
    synth.cancel();
    currentSentenceIndex = startIndex;
    isPlaying = true;
    playBtn.textContent = "⏸ PAUSA";
    bigStatusLabel.textContent = "IN LETTURA...";
    requestWakeLock();

    function playNext() {
      if (!isPlaying || currentSentenceIndex >= cleanSentences.length) {
        if (currentSentenceIndex >= cleanSentences.length && currentPage < totalPages) {
          currentPage++;
          loadPage(currentPage).then(() => speakSentences(0));
        } else {
          stopSpeech();
        }
        return;
      }

      const sentence = cleanSentences[currentSentenceIndex].trim();
      const utterance = new SpeechSynthesisUtterance(sentence);
      
      if (voices[voiceSelect.value]) utterance.voice = voices[voiceSelect.value];
      
      let baseRate = parseFloat(rateSelect.value);

      // Regia Prosodica: Rallenta leggermente su definizioni o frasi chiave
      if (/si definisce|consiste in|è fondamentale|importante|significa|ricordiamo che|in conclusione/i.test(sentence)) {
        utterance.rate = baseRate * 0.9;
        utterance.pitch = 1.05;
      } else if (sentence.length < 45 && !sentence.includes('.')) {
        // Tratta i titoli brevi con tono leggermente diverso
        utterance.pitch = 0.95;
        utterance.rate = baseRate * 0.95;
      } else {
        utterance.rate = baseRate;
        utterance.pitch = 1.0;
      }

      utterance.onend = () => {
        currentSentenceIndex++;
        playNext();
      };
      utterance.onerror = () => stopSpeech();
      
      synth.speak(utterance);
    }

    playNext();
  }

  function stopSpeech() {
    isPlaying = false;
    synth.cancel();
    playBtn.textContent = "▶ LEGGI";
    bigStatusLabel.textContent = "IN PAUSA";
  }

  // Smart Auto-Rewind: Torna indietro di 2 frasi quando riprendi dopo una pausa
  playBtn.addEventListener('click', () => {
    if (!pdfDoc) return;
    if (isPlaying) {
      stopSpeech();
    } else {
      const resumeIndex = Math.max(0, currentSentenceIndex - 2);
      speakSentences(resumeIndex);
    }
  });

  prevBtn.addEventListener('click', async () => {
    if (pdfDoc && currentPage > 1) {
      currentPage--;
      await loadPage(currentPage);
      speakSentences(0);
    }
  });

  nextBtn.addEventListener('click', async () => {
    if (pdfDoc && currentPage < totalPages) {
      currentPage++;
      await loadPage(currentPage);
      speakSentences(0);
    }
  });

  // 6. Modalità Schermo Nero Tattile (Gesti Ciechi per Auto)
  let lastTouchTime = 0;
  touchPad.addEventListener('click', (e) => {
    const now = new Date().getTime();
    if (now - lastTouchTime < 300) {
      // Doppio tocco: Salva Segnalibro Vocale al volo mentre guidi
      bookmarkBtn.click();
      e.stopPropagation();
    } else {
      // Singolo tocco: Pausa / Play rapido senza guardare lo schermo
      if (!pdfDoc) return;
      if (isPlaying) {
        stopSpeech();
      } else {
        speakSentences(currentSentenceIndex);
      }
    }
    lastTouchTime = now;
  });

  // 7. Funzioni Didattiche Avanzate (Spiegazione e Quiz Vocale Offline)
  summaryBtn.addEventListener('click', () => {
    if (!cleanSentences.length) return;
    const summary = generateTeacherSummary();
    synth.cancel();
    isPlaying = true;
    playBtn.textContent = "⏸ PAUSA";
    bigStatusLabel.textContent = "SPIEGAZIONE PROF";
    
    const utt = new SpeechSynthesisUtterance(summary);
    if (voices[voiceSelect.value]) utt.voice = voices[voiceSelect.value];
    utt.rate = parseFloat(rateSelect.value);
    utt.onend = () => stopSpeech();
    synth.speak(utt);
  });

  function generateTeacherSummary() {
    if (cleanSentences.length <= 2) return "Ecco i punti chiave di questa breve pagina: " + textDisplay.textContent;
    return `In sintesi, per questa pagina focalizzati su questi aspetti. Primo concetto chiave: ${cleanSentences[0]} Secondo punto fondamentale: ${cleanSentences[Math.floor(cleanSentences.length / 2)]} E ricorda la conclusione: ${cleanSentences[cleanSentences.length - 1]}`;
  }

  quizBtn.addEventListener('click', () => {
    if (!cleanSentences.length) return;
    synth.cancel();
    isPlaying = true;
    bigStatusLabel.textContent = "QUIZ VOCALE";
    
    const questionText = `Domanda di verifica sulla pagina corrente. Rifletti su questo concetto: ${cleanSentences[0]} ... Ti lascio cinque secondi per pensare alla risposta a voce alta.`;
    const answerText = `Ecco la soluzione corretta estratta dal testo: ${cleanSentences[0]}`;

    const utt1 = new SpeechSynthesisUtterance(questionText);
    if (voices[voiceSelect.value]) utt1.voice = voices[voiceSelect.value];
    
    utt1.onend = () => {
      // Pausa di 5 secondi in silenzio per permettere all'utente di rispondere in auto
      setTimeout(() => {
        if (!isPlaying) return;
        const utt2 = new SpeechSynthesisUtterance(answerText);
        if (voices[voiceSelect.value]) utt2.voice = voices[voiceSelect.value];
        utt2.onend = () => stopSpeech();
        synth.speak(utt2);
      }, 5000);
    };
    synth.speak(utt1);
  });

  // 8. Segnalibri Vocali Permanenti
  bookmarkBtn.addEventListener('click', () => {
    if (!currentFileName || !cleanSentences[currentSentenceIndex]) return;
    const bText = `Pag. ${currentPage}: "${cleanSentences[currentSentenceIndex].substring(0, 60)}..."`;
    bookmarks.push(bText);
    localStorage.setItem(`bookmarks_${currentFileName}`, JSON.stringify(bookmarks));
    renderBookmarks();
    
    // Feedback sonoro rapido di conferma
    const confirmUtt = new SpeechSynthesisUtterance("Segnalibro salvato.");
    if (voices[voiceSelect.value]) confirmUtt.voice = voices[voiceSelect.value];
    synth.speak(confirmUtt);
  });

  function loadBookmarks() {
    if (!currentFileName) return;
    const saved = localStorage.getItem(`bookmarks_${currentFileName}`);
    bookmarks = saved ? JSON.parse(saved) : [];
    renderBookmarks();
  }

  function renderBookmarks() {
    if (bookmarks.length === 0) {
      bookmarksList.innerHTML = "<strong>Segnalibri vocali salvati:</strong> Nessuno";
    } else {
      bookmarksList.innerHTML = "<strong>Segnalibri vocali salvati:</strong><br>" + bookmarks.join('<br>');
    }
  }

  // 9. Media Session API (Comandi al volante Bluetooth)
  function updateMediaSession() {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `Pagina ${currentPage} di ${totalPages}`,
        artist: 'CarPDF Ultimate',
        album: currentFileName
      });
      navigator.mediaSession.setActionHandler('play', () => speakSentences(currentSentenceIndex));
      navigator.mediaSession.setActionHandler('pause', () => stopSpeech());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
    }
  }

  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
