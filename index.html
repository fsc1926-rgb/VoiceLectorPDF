<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CarPDF Kokoro Ultimate</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    :root { --bg: #000; --card: #121212; --accent: #38bdf8; --accent-green: #4ade80; --tutor: #a855f7; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; display: flex; flex-direction: column; gap: 10px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; }
    h1 { font-size: 1.15rem; color: var(--accent); }
    .badge { font-size: 0.7rem; background: #1e293b; color: var(--accent); padding: 3px 8px; border-radius: 6px; }
    .ai-badge { color: var(--tutor); border: 1px solid var(--tutor); }

    .card { background: var(--card); border: 1px solid #222; border-radius: 14px; padding: 14px; }
    input[type="file"] { display: none; }
    .btn-upload { display: block; width: 100%; text-align: center; background: var(--accent); color: #000; font-weight: 700; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; }
    
    .car-mode-screen { background: #080808; border: 2px dashed #333; border-radius: 14px; padding: 16px; text-align: center; min-height: 140px; display: flex; flex-direction: column; justify-content: center; gap: 8px; transition: transform 0.5s ease; cursor: pointer;}
    .car-mode-screen:active { background: #1a1a1a; }
    .status-info { font-size: 0.85rem; color: var(--muted); }
    .main-action-text { font-size: 1.3rem; font-weight: 800; color: var(--accent-green); }
    .tutor-active { color: var(--tutor) !important; font-size: 1.5rem !important; }
    .mic-status { font-size: 0.8rem; color: #ef4444; margin-top: 4px; display: none; font-weight: bold; }

    .car-controls { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-car { border: none; border-radius: 12px; padding: 18px 8px; font-size: 1rem; font-weight: 700; cursor: pointer; color: var(--text); background: #222; }
    .btn-play { background: var(--accent-green); color: #000; font-size: 1.2rem; }

    .toolbar-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-tool { flex: 1 1 45%; padding: 10px 4px; background: #1a1a1a; border: 1px solid #333; color: var(--text); border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center;}
    
    .text-box { max-height: 140px; overflow-y: auto; font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Audio Silenzioso per aggirare blocco background -->
  <audio id="silent-audio" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

  <header>
    <h1>🚗 CarPDF Kokoro</h1>
    <span id="gemini-status" class="badge ai-badge">AI Nativa...</span>
  </header>

  <div class="card">
    <label class="btn-upload">📂 Seleziona o Cambia PDF <input type="file" id="pdf-upload" accept="application/pdf"></label>
  </div>

  <div class="card">
    <div id="touch-pad" class="car-mode-screen">
      <div class="status-info" id="book-title">In attesa del Motore Kokoro...</div>
      <div class="main-action-text" id="big-status-label">INIZIALIZZAZIONE</div>
      <div class="status-info" id="page-indicator">Pag. 0 / 0</div>
      <div class="mic-status" id="mic-indicator">🎙️ Microfono in Ascolto</div>
    </div>

    <div class="car-controls">
      <button class="btn-car" id="prev-btn">⏮ Indietro</button>
      <button class="btn-car btn-play" id="play-btn">▶ LEGGI</button>
      <button class="btn-car" id="next-btn">Avanti ⏭</button>
    </div>

    <div class="toolbar-row">
      <button class="btn-tool" id="mic-btn">🎙️ Attiva Ascolto</button>
      <button class="btn-tool" id="bookmark-btn">📌 Salva Appunto</button>
    </div>
  </div>

  <div class="card" style="flex: 1;">
    <div id="text-display" class="text-box">Attendi che il download arrivi al 100% prima di caricare il PDF o premere Leggi.</div>
  </div>

<script type="module">
  // Usa la versione "@next" (Bleeding Edge) che contiene il supporto ufficiale a Kokoro
  import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@next';
  
  // PATCH PER PC SU GITHUB PAGES: Disabilita Web Worker Threading che causa blocchi CORS/COEP
  env.allowLocalModels = false;
  env.backends.onnx.wasm.numThreads = 1;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfDoc = null, currentPage = 1, totalPages = 0, cleanSentences = [], currentSentenceIndex = 0;
  let isPlaying = false, currentFileName = "", bookmarks = [];
  
  // AudioContext NON viene creato all'avvio per non violare le Autoplay Policy dei PC
  let audioCtx = null;
  let currentAudioSource = null;
  let kokoroSynthesizer = null;
  
  let hasGemini = false;
  let geminiSession = null;

  const playBtn = document.getElementById('play-btn');
  const bigStatusLabel = document.getElementById('big-status-label');
  const textDisplay = document.getElementById('text-display');
  const silentAudio = document.getElementById('silent-audio');
  const micIndicator = document.getElementById('mic-indicator');

  // --- 1. INIZIALIZZAZIONE KOKORO TTS (ANTI-CRASH) ---
  async function initKokoro() {
    try {
      bigStatusLabel.textContent = "DOWNLOAD...";
      kokoroSynthesizer = await pipeline('text-to-speech', 'onnx-community/Kokoro-82M-v1.0-ONNX', {
        dtype: 'q8',
        progress_callback: (progress) => {
          if (progress.status === 'progress' && progress.total) {
            const pct = Math.round((progress.loaded / progress.total) * 100);
            bigStatusLabel.textContent = `DOWNLOAD: ${pct}%`;
          }
        }
      });
      bigStatusLabel.textContent = "PRONTO";
      document.getElementById('book-title').textContent = "Motore Vocale AI Attivo";
      textDisplay.textContent = "Modello caricato con successo. Ora puoi selezionare un PDF e iniziare l'ascolto.";
    } catch (err) {
      bigStatusLabel.textContent = "ERRORE";
      // Questo mostrerà l'errore reale a schermo se qualcosa va storto
      textDisplay.textContent = "Dettaglio Errore: " + err.message;
      console.error(err);
    }
  }
  
  // Avvia il download
  initKokoro();

  // --- 2. CONTROLLO GEMINI NANO ---
  async function checkGemini() {
    if ('ai' in self && 'languageModel' in self.ai) {
      const caps = await self.ai.languageModel.capabilities();
      if (caps.available !== 'no') {
        hasGemini = true;
        geminiSession = await self.ai.languageModel.create({
          systemPrompt: "Sei un tutor. Spiega in modo conciso, in italiano."
        });
        document.getElementById('gemini-status').textContent = "🧠 Gemini Attivo";
      }
    } else {
      document.getElementById('gemini-status').textContent = "⚙️ Assistente Base";
    }
  }
  checkGemini();

  // --- 3. GESTIONE PDF E OCR ---
  document.getElementById('pdf-upload').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    currentFileName = file.name;
    document.getElementById('book-title').textContent = currentFileName.substring(0, 22);
    const arrayBuffer = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    totalPages = pdfDoc.numPages;
    
    const pos = JSON.parse(localStorage.getItem(`kokoro_pos_${currentFileName}`));
    currentPage = pos ? pos.p : 1;
    await loadPage(currentPage);
    if (pos && pos.s) currentSentenceIndex = pos.s;
  });

  async function loadPage(pageNum) {
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(pageNum);
    const textContent = await page.getTextContent();
    let text = textContent.items.map(i => i.str).join(' ').replace(/-\s+/g, '').replace(/\s+/g, ' ').trim();
    
    if (text.length < 20) {
      bigStatusLabel.textContent = "OCR IN CORSO...";
      const viewport = page.getViewport({scale: 1.5});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise;
      const { data: { text: ocrText } } = await Tesseract.recognize(canvas, 'ita');
      text = ocrText.replace(/\s+/g, ' ').trim();
      bigStatusLabel.textContent = "PRONTO";
    }

    textDisplay.textContent = text || "(Nessun testo)";
    document.getElementById('page-indicator').textContent = `Pag. ${currentPage} / ${totalPages}`;
    
    cleanSentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
    currentSentenceIndex = 0;
  }

  // --- 4. MOTORE AUDIO KOKORO ---
  async function generateAndPlayAudio(textToSpeak, voiceProfile = 'it_nicola') {
    if (!kokoroSynthesizer) return;
    
    bigStatusLabel.textContent = "ELABORAZIONE...";
    const safeText = textToSpeak.substring(0, 450); 
    const result = await kokoroSynthesizer(safeText, { voice: voiceProfile });
    
    return new Promise((resolve) => {
      // Inizializza o riattiva l'audioContext in modo sicuro
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const audioBuffer = audioCtx.createBuffer(1, result.audio.length, result.sampling_rate);
      audioBuffer.getChannelData(0).set(result.audio);
      
      currentAudioSource = audioCtx.createBufferSource();
      currentAudioSource.buffer = audioBuffer;
      currentAudioSource.connect(audioCtx.destination);
      
      currentAudioSource.onended = () => { resolve(); };
      
      bigStatusLabel.className = "main-action-text";
      bigStatusLabel.textContent = "IN LETTURA...";
      currentAudioSource.start();
    });
  }

  async function speakSentences(startIndex = 0) {
    if (!cleanSentences.length || !kokoroSynthesizer) return;
    isPlaying = true;
    currentSentenceIndex = startIndex;
    playBtn.textContent = "⏸ PAUSA";
    silentAudio.play().catch(()=>{});

    while (isPlaying && currentSentenceIndex < cleanSentences.length) {
      const sentence = cleanSentences[currentSentenceIndex].trim();
      if (sentence.length > 2) {
        localStorage.setItem(`kokoro_pos_${currentFileName}`, JSON.stringify({ p: currentPage, s: currentSentenceIndex }));
        const voiceProfile = /si definisce|importante|attenzione/i.test(sentence) || sentence.length < 40 ? 'it_isabella' : 'it_nicola';
        await generateAndPlayAudio(sentence, voiceProfile);
      }
      if (!isPlaying) break;
      currentSentenceIndex++;
    }

    if (isPlaying && currentSentenceIndex >= cleanSentences.length && currentPage < totalPages) {
      currentPage++;
      await loadPage(currentPage);
      speakSentences(0);
    } else if (isPlaying) {
      stopSpeech();
    }
  }

  function stopSpeech() {
    isPlaying = false;
    if (currentAudioSource) {
      currentAudioSource.stop();
      currentAudioSource.disconnect();
    }
    silentAudio.pause();
    playBtn.textContent = "▶ LEGGI"; 
    bigStatusLabel.textContent = "IN PAUSA";
  }

  // PATCH PC: L'audio si sblocca qui, al clic fisico dell'utente
  playBtn.addEventListener('click', () => { 
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (isPlaying) stopSpeech(); else speakSentences(currentSentenceIndex); 
  });

  document.getElementById('prev-btn').addEventListener('click', async () => { if (pdfDoc && currentPage > 1) { currentPage--; await loadPage(currentPage); speakSentences(0); }});
  document.getElementById('next-btn').addEventListener('click', async () => { if (pdfDoc && currentPage < totalPages) { currentPage++; await loadPage(currentPage); speakSentences(0); }});

  // --- 5. ASSISTENTE VOCALE E APPUNTI ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'it-IT';
    recognition.continuous = true;
    
    recognition.onresult = async (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
      if (transcript.includes("non ho capito") || transcript.includes("spiega") || transcript.includes("esempio")) {
        stopSpeech();
        bigStatusLabel.className = "main-action-text tutor-active";
        bigStatusLabel.textContent = "ELABORAZIONE AI...";
        const contextText = cleanSentences.slice(Math.max(0, currentSentenceIndex - 1), currentSentenceIndex + 1).join(" ");
        let answer = `Ok, rivediamo questo punto: ${contextText}`;
        if (hasGemini && geminiSession) answer = await geminiSession.prompt(`Spiega questo concetto in modo semplice: "${contextText}"`);
        await generateAndPlayAudio(answer, 'it_isabella');
        speakSentences(currentSentenceIndex);
      } else if (transcript.includes("pausa") || transcript.includes("ferma")) {
        stopSpeech();
      }
    };
    recognition.onend = () => { if (isListening) recognition.start(); };
  }

  document.getElementById('mic-btn').addEventListener('click', () => {
    if (!recognition) return alert("Riconoscimento vocale non supportato.");
    isListening = !isListening;
    micIndicator.style.display = isListening ? "block" : "none";
    if (isListening) recognition.start(); else recognition.stop();
  });

  document.getElementById('bookmark-btn').addEventListener('click', async () => {
    if (!cleanSentences[currentSentenceIndex]) return;
    bookmarks.push(`Pag. ${currentPage}: ${cleanSentences[currentSentenceIndex]}`);
    await generateAndPlayAudio("Salvato", 'it_isabella');
  });

  document.getElementById('touch-pad').addEventListener('click', () => {
    if (isPlaying) stopSpeech(); else if (pdfDoc) speakSentences(currentSentenceIndex);
  });
</script>
</body>
</html>
