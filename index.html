<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CarPDF Tutor AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    :root { --bg: #000; --card: #121212; --accent: #38bdf8; --accent-green: #4ade80; --tutor: #a855f7; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; display: flex; flex-direction: column; gap: 10px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; }
    h1 { font-size: 1.15rem; color: var(--accent); }
    .badge { font-size: 0.7rem; background: #1e293b; color: var(--accent); padding: 3px 8px; border-radius: 6px; }
    .ai-badge { color: var(--tutor); border: 1px solid var(--tutor); }

    .card { background: var(--card); border: 1px solid #222; border-radius: 14px; padding: 14px; }
    input[type="file"] { display: none; }
    .btn-upload { display: block; width: 100%; text-align: center; background: var(--accent); color: #000; font-weight: 700; padding: 12px; border-radius: 10px; cursor: pointer; }
    
    .car-mode-screen { background: #080808; border: 2px dashed #333; border-radius: 14px; padding: 16px; text-align: center; min-height: 140px; display: flex; flex-direction: column; justify-content: center; gap: 8px; transition: transform 0.5s ease; cursor: pointer;}
    .car-mode-screen:active { background: #1a1a1a; }
    .status-info { font-size: 0.85rem; color: var(--muted); }
    .main-action-text { font-size: 1.3rem; font-weight: 800; color: var(--accent-green); }
    .tutor-active { color: var(--tutor) !important; font-size: 1.5rem !important; }
    .mic-status { font-size: 0.8rem; color: #ef4444; margin-top: 4px; display: none; font-weight: bold; }

    .car-controls { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-car { border: none; border-radius: 12px; padding: 18px 8px; font-size: 1rem; font-weight: 700; cursor: pointer; color: var(--text); background: #222; }
    .btn-play { background: var(--accent-green); color: #000; font-size: 1.2rem; }

    .toolbar-row { display: flex; gap: 6px; margin-top: 8px; }
    .btn-tool { flex: 1; padding: 10px 4px; background: #1a1a1a; border: 1px solid #333; color: var(--text); border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    
    .text-box { max-height: 100px; overflow-y: auto; font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Audio Silenzioso Anti-Blocco (0 KB) -->
  <audio id="silent-audio" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

  <header>
    <h1>🚗 CarPDF Tutor</h1>
    <span id="ai-status" class="badge ai-badge">Tutor AI in attesa...</span>
  </header>

  <div class="card">
    <label class="btn-upload">📂 Seleziona PDF <input type="file" id="pdf-upload" accept="application/pdf"></label>
  </div>

  <div class="card">
    <div id="touch-pad" class="car-mode-screen">
      <div class="status-info" id="book-title">Nessun PDF caricato</div>
      <div class="main-action-text" id="big-status-label">PRONTO</div>
      <div class="status-info" id="page-indicator">Pag. 0 / 0</div>
      <div class="mic-status" id="mic-indicator">🎙️ Microfono Sempre Attivo</div>
    </div>

    <div class="car-controls">
      <button class="btn-car" id="prev-btn">⏮ Ind</button>
      <button class="btn-car btn-play" id="play-btn">▶ LEGGI</button>
      <button class="btn-car" id="next-btn">Av ⏭</button>
    </div>

    <div class="toolbar-row">
      <button class="btn-tool" id="mic-btn">🎙️ Attiva Ascolto AI</button>
      <button class="btn-tool" id="bookmark-btn">📌 Segnalibro</button>
    </div>
  </div>

  <div class="card" style="flex: 1;">
    <div id="text-display" class="text-box">Mentre legge in auto, prova a dire: "Ferma, non ho capito" oppure "Fammi un esempio pratico". Il Tutor ti risponderà.</div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfDoc = null, currentPage = 1, totalPages = 0, cleanSentences = [], currentSentenceIndex = 0;
  let isPlaying = false, currentFileName = "", bookmarks = [];
  let synth = window.speechSynthesis;
  let voiceNarrator = null; // Voce di base (Lettore)
  let voiceTutor = null;    // Voce AI (Assistente)
  let hasBuiltInAI = false;
  let aiSession = null;

  const playBtn = document.getElementById('play-btn');
  const bigStatusLabel = document.getElementById('big-status-label');
  const textDisplay = document.getElementById('text-display');
  const silentAudio = document.getElementById('silent-audio');
  const micIndicator = document.getElementById('mic-indicator');

  // --- 1. CONFIGURAZIONE 2 VOCI (0 KB, Native) ---
  function setupVoices() {
    const voices = synth.getVoices().filter(v => v.lang.startsWith('it'));
    if (voices.length > 0) {
      // Cerca di separare due voci diverse (es. una Google e una di sistema locale, o Maschio/Femmina)
      voiceNarrator = voices.find(v => v.name.includes('Network') || v.name.includes('Natural')) || voices[0];
      voiceTutor = voices.find(v => v !== voiceNarrator) || voiceNarrator; // Se ce n'è solo 1 usa la stessa
    }
  }
  setupVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = setupVoices;

  // --- 2. INTEGRAZIONE NATIVA GEMINI NANO (0 KB, On-Device) ---
  async function checkNativeAI() {
    if ('ai' in self && 'languageModel' in self.ai) {
      const caps = await self.ai.languageModel.capabilities();
      if (caps.available !== 'no') {
        hasBuiltInAI = true;
        aiSession = await self.ai.languageModel.create({
          systemPrompt: "Sei un tutor per uno studente universitario che guida l'auto. Spiega i concetti in massimo 3 frasi brevi, in italiano, in modo molto semplice."
        });
        document.getElementById('ai-status').textContent = "🧠 Gemini Nano Attivo";
      }
    }
  }
  checkNativeAI();

  // --- LETTURA E CARICAMENTO PDF ---
  document.getElementById('pdf-upload').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    currentFileName = file.name;
    document.getElementById('book-title').textContent = currentFileName.substring(0, 22);
    const arrayBuffer = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    totalPages = pdfDoc.numPages;
    await loadPage(1);
    checkMorningReview(); // Controlla se c'è un ripasso da fare!
  });

  async function loadPage(pageNum) {
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(pageNum);
    const textContent = await page.getTextContent();
    let text = textContent.items.map(i => i.str).join(' ').replace(/-\s+/g, '').replace(/\s+/g, ' ').trim();
    textDisplay.textContent = text || "(Nessun testo)";
    document.getElementById('page-indicator').textContent = `Pag. ${currentPage} / ${totalPages}`;
    cleanSentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
    currentSentenceIndex = 0;
  }

  // --- PODCAST A 2 VOCI ---
  function speakSentences(startIndex = 0) {
    if (!cleanSentences.length) return;
    synth.cancel();
    currentSentenceIndex = startIndex;
    isPlaying = true;
    playBtn.textContent = "⏸ PAUSA";
    bigStatusLabel.className = "main-action-text";
    bigStatusLabel.textContent = "IN LETTURA...";
    silentAudio.play().catch(()=>{});

    function playNext() {
      if (!isPlaying || currentSentenceIndex >= cleanSentences.length) {
        if (currentSentenceIndex >= cleanSentences.length && currentPage < totalPages) {
          currentPage++; loadPage(currentPage).then(() => speakSentences(0));
        } else { stopSpeech(); }
        return;
      }
      
      const sentence = cleanSentences[currentSentenceIndex].trim();
      const utterance = new SpeechSynthesisUtterance(sentence);
      
      // REGIA: Se è una definizione o un titolo, usa la voce del TUTOR, altrimenti il NARRATORE
      if (/si definisce|importante|attenzione/i.test(sentence) || sentence.length < 40) {
        utterance.voice = voiceTutor;
        utterance.rate = 0.95; 
      } else {
        utterance.voice = voiceNarrator;
        utterance.rate = 1.05;
      }

      utterance.onend = () => { currentSentenceIndex++; playNext(); };
      synth.speak(utterance);
    }
    playNext();
  }

  function stopSpeech() {
    isPlaying = false; synth.cancel(); silentAudio.pause();
    playBtn.textContent = "▶ LEGGI"; bigStatusLabel.textContent = "IN PAUSA";
  }

  playBtn.addEventListener('click', () => { if (isPlaying) stopSpeech(); else speakSentences(currentSentenceIndex); });

  // --- 3. CONVERSAZIONE ATTIVA (Speech Recognition + Gemini) ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'it-IT';
    recognition.continuous = true;
    recognition.interimResults = false;
    
    recognition.onresult = async (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
      
      if (transcript.includes("non ho capito") || transcript.includes("spiega") || transcript.includes("esempio")) {
        // Interrompe il narratore
        stopSpeech();
        bigStatusLabel.className = "main-action-text tutor-active";
        bigStatusLabel.textContent = "TUTOR IN ASCOLTO...";
        
        // Prende il contesto attuale per darlo all'AI
        const contextText = cleanSentences.slice(Math.max(0, currentSentenceIndex - 2), currentSentenceIndex + 1).join(" ");
        
        let answer = "";
        if (hasBuiltInAI && aiSession) {
           bigStatusLabel.textContent = "TUTOR PENSA...";
           answer = await aiSession.prompt(`Lo studente non ha capito questo concetto: "${contextText}". Fagli un esempio molto pratico, tratto dalla vita di tutti i giorni, per farglielo capire.`);
        } else {
           answer = `Provo a spiegartelo in modo più semplice. Il concetto chiave qui è: ${contextText}. Riprendiamo la lettura.`;
        }
        
        // Il Tutor risponde
        bigStatusLabel.textContent = "TUTOR PARLA";
        const responseUtt = new SpeechSynthesisUtterance(answer);
        responseUtt.voice = voiceTutor; // Usa la voce assistente!
        responseUtt.rate = 0.95;
        
        responseUtt.onend = () => {
          // Quando il tutor finisce, il narratore riprende automaticamente
          speakSentences(currentSentenceIndex); 
        };
        synth.speak(responseUtt);
      } 
      else if (transcript.includes("pausa") || transcript.includes("ferma")) {
        stopSpeech();
      }
    };
    
    // Auto-restart per mantenerlo sempre in ascolto in auto
    recognition.onend = () => { if (isListening) recognition.start(); };
  }

  document.getElementById('mic-btn').addEventListener('click', () => {
    if (!recognition) return alert("Riconoscimento vocale non supportato.");
    isListening = !isListening;
    if (isListening) {
      micIndicator.style.display = "block";
      recognition.start();
    } else {
      micIndicator.style.display = "none";
      recognition.stop();
    }
  });

  // --- 4. RIPASSO SMART (Spaced Repetition locale) ---
  document.getElementById('bookmark-btn').addEventListener('click', () => {
    if (!cleanSentences[currentSentenceIndex]) return;
    const bText = cleanSentences[currentSentenceIndex];
    bookmarks.push({ text: bText, date: new Date().toLocaleDateString() });
    localStorage.setItem('carpdf_bookmarks', JSON.stringify(bookmarks));
    
    const utt = new SpeechSynthesisUtterance("Appunto salvato.");
    utt.voice = voiceTutor; synth.speak(utt);
  });

  function checkMorningReview() {
    const saved = localStorage.getItem('carpdf_bookmarks');
    if (!saved) return;
    bookmarks = JSON.parse(saved);
    if (bookmarks.length === 0) return;
    
    // Controlla se c'è un appunto del giorno prima
    const today = new Date().toLocaleDateString();
    const oldBookmarks = bookmarks.filter(b => b.date !== today);
    
    if (oldBookmarks.length > 0) {
      const question = oldBookmarks[oldBookmarks.length - 1].text;
      
      const utt1 = new SpeechSynthesisUtterance("Bentornato in auto. Prima di riprendere, proviamo a fare un ripasso veloce di ieri. Completa questa frase ad alta voce: " + question.substring(0, question.length / 2) + "...");
      utt1.voice = voiceTutor;
      
      utt1.onend = () => {
        // Pausa di 5 secondi per far rispondere l'utente ad alta voce
        setTimeout(() => {
          const utt2 = new SpeechSynthesisUtterance("La risposta corretta era: " + question);
          utt2.voice = voiceTutor;
          synth.speak(utt2);
        }, 5000);
      };
      synth.speak(utt1);
    }
  }

  // Comandi a Schermo Nero Rapidi
  document.getElementById('touch-pad').addEventListener('click', () => {
    if (isPlaying) stopSpeech(); else if (pdfDoc) speakSentences(currentSentenceIndex);
  });
</script>
</body>
</html>
